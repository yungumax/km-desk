%22%3A%22any%22%7D%5D%7D" data-page-node-id="K1GU6pw5vDfJ8jBhxYzyfw">
<style>
  :root{
    --bg:#f4f7f9; --card:#ffffff; --ink:#1f2a30; --sub:#6b7a82;
    --line:#e6edf0; --main:#0078D4; --main2:#5ea0e0; --main-d:#005a9e; --accent:#ffb020;
    --topbg:rgba(244,247,249,.92);
    --red:#e5484d; --green:#1f9d55; --shadow:0 4px 16px rgba(31,42,48,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  .top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
  .brand svg{width:22px;height:22px;stroke:var(--main)}
  .spacer{flex:1}
  .sync{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--main)}
  .iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 9px;font-size:12px;
    color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .iconbtn svg{width:14px;height:14px}
  .today{margin:14px;background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;border-radius:16px;
    padding:16px;box-shadow:var(--shadow)}
  .today h2{margin:0 0 4px;font-size:15px;opacity:.95;font-weight:600;display:flex;align-items:center;gap:6px}
  .today h2 svg{width:18px;height:18px}
  .tdate{font-size:12px;opacity:.85;margin-bottom:10px}
  .titem{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;align-items:center;gap:10px}
  .titem.overdue{background:rgba(229,72,77,.28);border:1px solid rgba(255,255,255,.4)}
  .titem .tx{flex:1;font-size:13px}
  .titem .tx b{font-weight:600}
  .tbtn{background:var(--card);color:var(--main);border:none;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .titem.overdue .tbtn{color:var(--red)}
  .tnone{font-size:13px;opacity:.9}
  .tabs{display:flex;gap:6px;padding:0 14px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-width:60px;text-align:center;padding:9px 8px;border-radius:12px;font-size:13px;
    color:var(--sub);background:var(--card);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
  .tab.active{background:var(--main);color:#fff;border-color:var(--main);font-weight:600}
  .wrap{margin:14px}
  .panel{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:7px}
  .panel h3 svg{width:18px;height:18px;color:var(--main)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:84px;background:var(--bg);border-radius:12px;padding:12px;text-align:center}
  .stat .n{font-size:22px;font-weight:700;color:var(--main)}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--main);color:#fff;
    border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
  .btn2{background:var(--main2)}
  .btn.ghost{background:#fff;color:var(--main);border:1px solid var(--main)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn svg{width:16px;height:16px}
  .prog{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:8px}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--main2));border-radius:6px}
  .lvl{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .lvl.locked{opacity:.55}
  .lvl .top{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;margin:0}
  .lvl .badge{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;
    justify-content:center;color:var(--main);font-weight:700;flex-shrink:0}
  .lvl .badge svg{width:22px;height:22px}
  .lvl .info{flex:1}
  .lvl .info .t{font-weight:600;font-size:14px}
  .lvl .info .d{font-size:12px;color:var(--sub)}
  .lvl .pts{font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap}
  .rw{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .rw .gift{width:38px;height:38px;border-radius:10px;background:#fff4e0;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
  .rw .gift svg{width:20px;height:20px}
  .rw .info{flex:1}
  .rw .info .t{font-weight:600;font-size:14px}
  .rw .info .c{font-size:12px;color:var(--sub)}
  .rw .act{border:1px solid var(--main);color:var(--main);background:var(--card);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer}
  .rw .act:disabled{opacity:.4;cursor:not-allowed}
  .item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .item .q{font-weight:600;font-size:14px;margin-bottom:4px}
  .item .meta{font-size:12px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

<script>

/* ============ 云端同步配置 ============ */

var SKEY="wb_km_session";      // 本地会话键（仅本机，不上云）
var UKEY="wb_km_ukey";         // 持久化会话密钥（按账号，用于刷新后免密自动恢复登录；退出登录即清除）

function parseDate(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtMD(s){var p=s.split("-");return (+p[1])+"月"+(+p[2])+"日";}

/* ---- 账户 / 会话 ---- */
function curUser(){return ROOT.accounts[sess.user];}

function restoreSession(){try{var s=localStorage.getItem(SKEY);if(s){var o=JSON.parse(s);if(o&&o.user&&o.lib)return o;}}catch(e){}return null;}

/* ---- 密码哈希（优先 PBKDF2；非安全上下文降级简单加盐哈希） ---- */
function bufToB64(buf){var b="",bytes=new Uint8Array(buf);for(var i=0;i<bytes.length;i++)b+=String.fromCharCode(bytes[i]);return btoa(b);}
function b64ToBuf(b){var s=atob(b),bytes=new Uint8Array(s.length);for(var i=0;i<s.length;i++)bytes[i]=s.charCodeAt(i);return bytes.buffer;}
function newSalt(){var a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else{for(var i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);}return bufToB64(a.buffer);}
function hasSubtle(){return !!(window.crypto&&crypto.subtle&&crypto.subtle.deriveBits);}
function fallbackHash(pw,salt){var s=pw+"|"+salt,h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}for(var r=0;r<2048;r++){h^=(h>>>13);h=Math.imul(h,0x01000193);}return ("0000000"+((h>>>0).toString(16))).slice(-8);}
async function hashPassword(pw,salt){
  if(hasSubtle()){try{var enc=new TextEncoder();var key=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveBits"]);var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64ToBuf(salt),iterations:100000,hash:"SHA-256"},key,256);return "pbkdf2$"+bufToB64(bits);}catch(e){}}
  return "fb$"+fallbackHash(pw,salt);
}
async function verifyPassword(pw,salt,stored){return (await hashPassword(pw,salt))===stored;}

/* ============ Supabase 同步（方案B：自托管 + 多端实时同步） ============ */
/* 把下面两个常量填好即可启用；留空则退回原有「资料库 / 本地」模式，向后兼容 */
var SUPABASE_URL="https://bfwkamooggnvnoxrkybx.supabase.co";      // 你的 Supabase 项目 URL，如 https://xxxx.supabase.co
var SUPABASE_ANON="sb_publishable__jppnHZT9WHgoQXmXFje4Q_pkaqmlDf";     // 你的 anon / public key（公开安全，可写进前端）
var SUPABASE_KMKEY="0mTLOGZw41Yv4aFOY3un_bibnERm5mMEh1batE4WwzBjpx2o9WdF7g";    // 自定义长随机串：开启「校验请求头」RLS 策略后必填，配合 SQL 里的 x-km-key 校验；留空则不加该头（走 anon_all 宽松策略）
function SB_ENABLED(){return !!(SUPABASE_URL&&SUPABASE_ANON);}

var pollTimer=null;

/* ---- AES-GCM 加解密：密钥由「密码 + 账号 salt」派生，服务端只存密文 ---- */
async function deriveKey(pw,saltB64){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
  return await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64ToBuf(saltB64),iterations:100000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"]);
}
/* ---- 会话密钥持久化：刷新/重开免密自动恢复登录 ---- */
async function persistSessionKey(user,key){
  try{
    if(!user||!key||!key.extractable)return;
    var raw=await crypto.subtle.exportKey("raw",key);
    var store={};try{store=JSON.parse(localStorage.getItem(UKEY))||{};}catch(e){}
    store[user]=bufToB64(raw);
    localStorage.setItem(UKEY,JSON.stringify(store));
  }catch(e){}
}
async function restoreSessionKey(user){
  try{
    var store={};try{store=JSON.parse(localStorage.getItem(UKEY))||{};}catch(e){}
    if(!user||!store[user])return null;
    return await crypto.subtle.importKey("raw",b64ToBuf(store[user]),{name:"AES-GCM"},true,["encrypt","decrypt"]);
  }catch(e){return null;}
}
function forgetSessionKey(user){
  try{
    var store={};try{store=JSON.parse(localStorage.getItem(UKEY))||{};}catch(e){}
    if(user&&store&&store[user]){delete store[user];localStorage.setItem(UKEY,JSON.stringify(store));}
  }catch(e){}
}
async function aesEncrypt(obj,key){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var data=new TextEncoder().encode(JSON.stringify(obj));
  var ct=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,data);
  var out=new Uint8Array(iv.length+ct.byteLength);
  out.set(iv,0);out.set(new Uint8Array(ct),iv.length);
  return bufToB64(out.buffer);
}
async function aesDecrypt(b64,key){
  var bytes=new Uint8Array(b64ToBuf(b64));
  var iv=bytes.slice(0,12),ct=bytes.slice(12);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---- Supabase REST 直连（零依赖，纯 fetch） ---- */
function sbHeaders(extra){var h={"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json"};if(SUPABASE_KMKEY)h["x-km-key"]=SUPABASE_KMKEY;if(extra)for(var k in extra)h[k]=extra[k];return h;}
function sbTable(){return SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/km_users";}
async function sbGetAcc(name){
  var url=sbTable()+"?username=eq."+encodeURIComponent(name)+"&select=username,salt,payload,updated_at";
  var r=await fetch(url,{headers:sbHeaders()});
  if(!r.ok)throw new Error("get "+r.status);
  var arr=await r.json();
  return (arr&&arr.length)?arr[0]:null;
}
async function sbUpsertAcc(name,salt,payload){
  var r=await fetch(sbTable()+"?on_conflict=username",{method:"POST",headers:sbHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify([{username:name,salt:salt,payload:payload,updated_at:new Date().toISOString()}])});
  if(!r.ok)throw new Error("upsert "+r.status);
}
/* 把当前登录账号加密写入云端 */
async function sbSyncAcc(){
  if(!SB_ENABLED()||!sess||!SESS_KEY)return;
  try{
    setSync("同步中");
    var name=sess.user,acc=ROOT.accounts[name];
    var payload=await aesEncrypt(acc,SESS_KEY);
    await sbUpsertAcc(name,acc.salt,payload);
    lastPulledAt=new Date().toISOString();
    setSync("已同步");
  }catch(e){ setSync("离线"); }
}
/* 轮询拉取其他设备的改动 */
async function sbPullAcc(){
  if(!SB_ENABLED()||!sess||!SESS_KEY)return;
  try{
    var row=await sbGetAcc(sess.user);
    if(!row)return;
    if(lastPulledAt&&row.updated_at===lastPulledAt)return;
    var acc=await aesDecrypt(row.payload,SESS_KEY);
    var cur=ROOT.accounts[sess.user];
    if(JSON.stringify(acc)!==JSON.stringify(cur)){
      ROOT.accounts[sess.user]=acc;S=curLib();ensureLib(S);renderAll();
    }
    lastPulledAt=row.updated_at;
  }catch(e){/* 密钥不匹配等情况忽略 */ }
}
function startSync(){ stopSync(); if(!SB_ENABLED()||!sess)return; pollTimer=setInterval(sbPullAcc,5000); }
function stopSync(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }

function loadLocal(){try{var st=localStorage.getItem(KEY);if(st){ROOT=JSON.parse(st);migrateRoot();}}catch(e){}}
function migrateRoot(){

function ensureLib(L){

/* ============ 界面配色（参考 Windows 桌面个性化） ============ */
var WINDOWS_SCHEMES=[
  {key:"blue",  name:"默认蓝", hex:"#0078D4"},
  {key:"teal",  name:"海蓝",   hex:"#00A3A3"},
  {key:"green", name:"翠绿",   hex:"#107C10"},
  {key:"gold",  name:"金黄",   hex:"#F2A900"},

  {key:"pink",  name:"品红",   hex:"#D12476"},

  {key:"indigo",name:"靛蓝",   hex:"#4F6BED"}
];

function hexToRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbToHex(r,g,b){function c(x){var s=Math.max(0,Math.min(255,Math.round(x))).toString(16);return s.length<2?"0"+s:s;}return "#"+c(r)+c(g)+c(b);}

function accentByKey(key){for(var i=0;i<WINDOWS_SCHEMES.length;i++)if(WINDOWS_SCHEMES[i].key===key)return WINDOWS_SCHEMES[i];return WINDOWS_SCHEMES[0];}
function applyTheme(theme){
  theme=theme||defaultTheme();
  var ac=accentByKey(theme.accent).hex, root=document.documentElement.style;
  if(theme.mode==="dark"){
    root.setProperty("--bg","#1b1f24");root.setProperty("--card","#232a31");
    root.setProperty("--ink","#e8edf0");root.setProperty("--sub","#9aa7af");

    root.setProperty("--bg","#f4f7f9");root.setProperty("--card","#ffffff");
    root.setProperty("--ink","#1f2a30");root.setProperty("--sub","#6b7a82");
    root.setProperty("--line","#e6edf0");root.setProperty("--topbg","rgba(244,247,249,.92)");
  }
  root.setProperty("--main",ac);
  root.setProperty("--main2",mix(ac,"#000000",0.18));
  root.setProperty("--main-d",mix(ac,"#000000",0.24));
  root.setProperty("--accent","#ffb020");
  root.setProperty("--red","#e5484d");root.setProperty("--green","#1f9d55");
}

async function doRegister(){
  var name=document.getElementById("regUser").value.trim();
  var pw=document.getElementById("regPw").value, pw2=document.getElementById("regPw2").value;
  if(!name){showInfo("提示","请输入用户名");return;}
  if(name.length>20){showInfo("提示","用户名请控制在 20 字以内");return;}
  if(!pw||pw.length<4){showInfo("提示","密码至少 4 位");return;}
  if(pw!==pw2){showInfo("提示","两次输入的密码不一致");return;}
  if(ROOT.accounts[name]){showInfo("提示","该用户名已被注册，请直接登录");return;}
  var acc={salt:newSalt(),hash:"",libs:{},activeLib:null,theme:defaultTheme()};
  var libId="lib_"+uid(); acc.libs[libId]=seedLib(); acc.activeLib=libId;
  acc.hash=await hashPassword(pw,acc.salt);
  if(SB_ENABLED()){
    try{
      var ex=await sbGetAcc(name);
      if(ex){showInfo("提示","该用户名在云端已存在，请直接登录");return;}
      SESS_KEY=await deriveKey(pw,acc.salt);
      var payload=await aesEncrypt(acc,SESS_KEY);
      await sbUpsertAcc(name,acc.salt,payload);
      lastPulledAt=new Date().toISOString();
      await persistSessionKey(name,SESS_KEY);   // 记住登录态，刷新后免密自动恢复
    }catch(e){ showInfo("注册失败","无法连接云端："+e.message); return; }
  }
  ROOT.accounts[name]=acc;
  sess={user:name,lib:libId};saveSession();S=curLib();ensureLib(S);
  save();afterLogin();
}
async function doLogin(){
  var name=document.getElementById("loginUser").value.trim();
  var pw=document.getElementById("loginPw").value;
  if(SB_ENABLED()){
    try{
      var row=await sbGetAcc(name);
      var acc,key;
      if(row){
        key=await deriveKey(pw,row.salt);
        try{ acc=await aesDecrypt(row.payload,key); }
        catch(e){ showInfo("登录失败","用户名或密码错误"); return; }
        SESS_KEY=key; lastPulledAt=row.updated_at;
      }else if(ROOT.accounts[name]){           // 云端无记录 → 离线使用本地账号
        key=await deriveKey(pw,ROOT.accounts[name].salt);
        acc=ROOT.accounts[name]; lastPulledAt=null;
      }else{ showInfo("登录失败","云端无此账号，请先注册"); return; }
    }catch(e){                                  // 网络错误 → 回退本地
      if(ROOT.accounts[name]){ SESS_KEY=await deriveKey(pw,ROOT.accounts[name].salt); acc=ROOT.accounts[name]; lastPulledAt=null; }
      else { showInfo("登录失败","无法连接云端，且本地无该账号数据"); return; }
    }
    if(SESS_KEY)await persistSessionKey(name,SESS_KEY);   // 记住登录态，刷新后免密自动恢复
    ROOT.accounts[name]=acc;
    var lib=acc.activeLib&&acc.libs[acc.activeLib]?acc.activeLib:Object.keys(acc.libs)[0];
    sess={user:name,lib:lib};saveSession();S=curLib();ensureLib(S);
    save();afterLogin();
    return;
  }
  var acc2=ROOT.accounts[name];
  if(!acc2){showInfo("登录失败","用户名不存在，请先注册");return;}
  var ok=await verifyPassword(pw,acc2.salt,acc2.hash);
  if(!ok){showInfo("登录失败","密码错误");return;}
  var lib2=acc2.activeLib&&acc2.libs[acc2.activeLib]?acc2.activeLib:Object.keys(acc2.libs)[0];
  sess={user:name,lib:lib2};saveSession();S=curLib();ensureLib(S);
  save();afterLogin();
}

/* ============ 计算层 ============ */
function dueCards(){var t=todayStr();return S.cards.filter(function(c){return !c.mastered && c.dueDate<=t;});}
function wrongCards(){return S.cards.filter(function(c){return !c.mastered && c.wrongCount>0;});}
function totalPracticed(){var n=0;for(var k in S.daily){n+=(S.daily[k].practiced||0);}return n;}
function totalCorrect(){var n=0;for(var k in S.daily){n+=(S.daily[k].correct||0);}return n;}
function todayStat(){var t=todayStr();var d=S.daily[t];if(d)return {practiced:d.practiced||0,correct:d.correct||0,pointsEarned:d.pointsEarned||0,focus:d.focus||0,wrongRev:d.wrongRev||0,bonusClaimed:!!d.bonusClaimed};return {practiced:0,correct:0,pointsEarned:0,focus:0,wrongRev:0,bonusClaimed:false};}
function computeStreak(){
  var t=todayStr(),y=addDays(t,-1),n=0,cur=t;
  if(S.daily[t]&&S.daily[t].practiced>0){n=1;cur=y;}
  else if(S.daily[y]&&S.daily[y].practiced>0){cur=y;}
  else return 0;
  while(S.daily[cur]&&S.daily[cur].practiced>0){n++;cur=addDays(cur,-1);}
  return n;
}
function bestStreak(){
  var dates=Object.keys(S.daily).filter(function(k){return (S.daily[k].practiced||0)>0;}).sort();
  if(!dates.length)return 0;
  var prev=null,run=0,best=0;
  for(var i=0;i<dates.length;i++){
    if(prev&&addDays(prev,1)===dates[i]){run++;}else{run=1;}
    if(run>best)best=run;prev=dates[i];
  }
  return best;
}
function accuracyPct(){var t=totalPracticed();return t?Math.round(totalCorrect()/t*100):0;}
function subjectStats(){
  var map={};
  S.cards.forEach(function(c){
    if(!map[c.subject])map[c.subject]={total:0,correct:0,practiced:0,mastered:0};
    var m=map[c.subject];m.total++;if(c.mastered)m.mastered++;m.correct+=c.totalCorrect;m.practiced+=c.totalPracticed;
  });
  return map;
}
var REALMS=["炼气","筑基","金丹","元婴","化神","炼虚","合体","大乘","渡劫","飞升"];
var SUBS=["一层","二层","三层","四层","五层","六层","七层","八层","九层","大圆满"];
function lvlName(n){return REALMS[Math.floor((n-1)/10)]+SUBS[(n-1)%10];}
function totTarget(k){return Math.round(15+(k-1)*15+Math.pow(k-1,1.6)*6);}
function levelPts(n){return Math.round(20+(n-1)*6+Math.pow(n-1,1.5)*0.9);}
function buildLevels(){
  var arr=[],SM={5:7,15:21,25:30,35:60,45:100,55:150,65:200,75:300,85:365,95:500},ACC={50:90},to=0;
  for(var n=1;n<=100;n++){
    var nm=lvlName(n);
    if(SM[n]){arr.push({id:"L"+n,name:nm,need:"连续打卡 "+SM[n]+" 天",type:"streak",target:SM[n],pts:levelPts(n)});}
    else if(ACC[n]){arr.push({id:"L"+n,name:nm,need:"总正确率 ≥"+ACC[n]+"%",type:"accuracy",target:ACC[n],pts:levelPts(n)});}
    else{to++;arr.push({id:"L"+n,name:nm,need:"累计练习 "+totTarget(to)+" 张",type:"total",target:totTarget(to),pts:levelPts(n)});}
  }
  return arr;
}

  for(var i=6;i>=0;i--){var d=addDays(t,-i);var v=(S.daily[d]&&S.daily[d].practiced)||0;arr.push({d:d,v:v});if(v>max)max=v;}
  var html='<div style="display:flex;align-items:flex-end;gap:6px;height:90px">';
  arr.forEach(function(o){var h=Math.round(o.v/max*90);if(o.v===0)h=2;html+='<div style="flex:1;background:linear-gradient(180deg,#2f9e8f,#3b82f6);border-radius:5px 5px 0 0;min-width:14px;height:'+h+'px"></div>';});

  arr.forEach(function(o){html+='<div style="flex:1;text-align:center;font-size:10px;color:var(--sub)">'+o.d.split("-")[2]+'</div>';});
  html+='</div>';
  return html;
}

var timer=null,remain=0,running=false;
function fmtTime(s){var m=Math.floor(s/60),ss=s%60;return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;}
function tomatoTick(){remain--;var e=document.getElementById("tomatoTime");if(e)e.textContent=fmtTime(remain);if(remain<=0)finishTomato();}
function startTimer(){if(running)return;if(remain<=0)remain=(S.settings.focusMinutes||25)*60;running=true;timer=setInterval(tomatoTick,1000);updateTomato();}
function pauseTimer(){running=false;if(timer)clearInterval(timer);timer=null;updateTomato();}
function resetTimer(){pauseTimer();remain=(S.settings.focusMinutes||25)*60;updateTomato();}
function updateTomato(){var e=document.getElementById("tomatoTime");if(e)e.textContent=fmtTime(remain);}
function finishTomato(){
  pauseTimer();
  S.focusSessions=(S.focusSessions||0)+1;
  var t=todayStr();if(!S.daily[t])S.daily[t]={practiced:0,correct:0,pointsEarned:0,focus:0,wrongRev:0,bonusClaimed:false};
  S.daily[t].focus=(S.daily[t].focus||0)+1;
  S.points+=10;checkDailyBonus();save();renderAll();
  showInfo("专注完成","专注 25 分钟，+10 积分！继续加油。");
}

function lineSVG(arr){
  var w=300,h=60,max=1;arr.forEach(function(o){if(o.v>max)max=o.v;});
  var n=arr.length;
  var pts=arr.map(function(o,i){var x=Math.round(i/(n-1)*w);var y=h-Math.round(o.v/max*(h-12))-4;return x+","+y;}).join(" ");
  return '<svg class="tline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#2f9e8f" stroke-width="2"/><polyline points="0,'+h+' '+pts+' '+w+','+h+'" fill="rgba(47,158,143,.12)" stroke="none"/></svg>';
}

function renderAll(){
  if(!S)return;
  renderToday();
  if(session)return; // 练习/抽考会话进行中，保留会话视图
  switch(activeTab){
    case "practice":renderPractice();break;
    case "levels":renderLevels();break;
    case "points":renderPoints();break;
    case "wrong":renderWrong();break;
    case "calendar":renderCalendar();break;
    case "target":renderTarget();break;
    case "medal":renderMedal();break;
    case "tomato":renderTomato();break;
    case "quiz":renderQuiz();break;
    case "review":renderReview();break;
  }
}

/* ============ 练习会话（不持久化） ============ */
var session=null;
function startSession(){var due=dueCards();if(!due.length)return;session={queue:due.slice(),idx:0};showCard();}
function startWrong(){var wc=wrongCards();if(!wc.length)return;session={queue:wc.slice(),idx:0,wrong:true};showCard();}
function startQuiz(){
  if(!S.cards.length)return;
  var pool=S.cards.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;}
  var n=Math.min(10,pool.length);
  session={queue:pool.slice(0,n),idx:0,quiz:true};showCard();
}
function showCard(){
  if(!session||session.idx>=session.queue.length){endSession();return;}
  var c=session.queue[session.idx];
  var label=session.quiz?"抽考":(session.wrong?"重练错题":"练习");
  var html='<div class="panel"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M8 8h8M8 12h5"/></svg>'+label+'（'+(session.idx+1)+' / '+session.queue.length+'）</h3>';
  html+='<div class="item" style="margin-bottom:0"><div class="q">'+esc(c.question)+'</div>'+cardImg(c)+'<div class="meta"><span class="chip">'+esc(c.subject)+'</span></div>';
  html+='<div class="ans" id="sessAns" style="display:none"><b>答案：</b>'+esc(c.answer)+(c.analysis?'<br><b>解析：</b>'+esc(c.analysis):'')+'</div>';
  html+='<div class="ctrl">';
  html+='<button class="btn ghost" id="btnReveal" onclick="reveal()">显示答案</button>';
  html+='<button class="ok hidden" id="btnOk" onclick="answer(true)">我答对了</button>';
  html+='<button class="no hidden" id="btnNo" onclick="answer(false)">我答错了</button>';
  html+='</div></div></div>';
  setContent(html);
}
function reveal(){var a=document.getElementById("sessAns");if(a)a.style.display="block";var r=document.getElementById("btnReveal");if(r)r.classList.add("hidden");var o=document.getElementById("btnOk");if(o)o.classList.remove("hidden");var n=document.getElementById("btnNo");if(n)n.classList.remove("hidden");}
function answer(correct){
  var c=session.queue[session.idx];
  var t=todayStr();
  if(!S.daily[t])S.daily[t]={practiced:0,correct:0,pointsEarned:0,focus:0};
  S.daily[t].practiced++;c.totalPracticed++;
  if(correct){
    c.totalCorrect++;S.daily[t].correct++;S.points+=5;S.daily[t].pointsEarned+=5;
    if(c.wrongCount>0)c.wrongCount=Math.max(0,c.wrongCount-1);
    if(c.box<5)c.box++;else c.mastered=true;
    c.dueDate=addDays(t,INTERVAL[Math.min(c.box-1,4)]);
  }else{
    c.wrongCount++;S.points+=1;S.daily[t].pointsEarned+=1;c.box=1;c.dueDate=t;
  }
  if(!S.lastPractice||S.lastPractice<t)S.lastPractice=t;
  checkDailyBonus();save();session.idx++;showCard();
}
function endSession(){
  session=null;
  var html='<div class="panel"><div class="center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6 9 17l-5-5"/></svg><div style="margin-top:8px;font-weight:600">本轮练习完成！</div><div class="muted" style="margin-top:4px">积分已累计，去「关卡闯关」看看有没有可领取的奖励。</div></div>';
  html+='<button class="btn" onclick="switchTab(\'practice\')">返回</button></div>';
  setContent(html);
}
function judgeWrong(id,correct){
  var c=null;for(var i=0;i<S.cards.length;i++){if(S.cards[i].id===id){c=S.cards[i];break;}}
  if(!c)return;
  var t=todayStr();
  if(!S.daily[t])S.daily[t]={practiced:0,correct:0,pointsEarned:0,focus:0,wrongRev:0,bonusClaimed:false};
  S.daily[t].practiced++;S.daily[t].wrongRev=(S.daily[t].wrongRev||0)+1;c.totalPracticed++;
  if(correct){
    c.totalCorrect++;S.daily[t].correct++;S.points+=5;S.daily[t].pointsEarned+=5;
    if(c.wrongCount>0)c.wrongCount=Math.max(0,c.wrongCount-1);
    c.box=Math.min(5,c.box+1);c.dueDate=addDays(t,INTERVAL[Math.min(c.box-1,4)]);
  }else{
    c.wrongCount++;S.points+=1;S.daily[t].pointsEarned+=1;c.box=1;c.dueDate=t;
  }
  if(!S.lastPractice||S.lastPractice<t)S.lastPractice=t;
  checkDailyBonus();save();renderAll();
}

/* ============ 交互动作 ============ */
function claimLevel(id){
  var L=null;for(var i=0;i<LEVELS.length;i++){if(LEVELS[i].id===id)L=LEVELS[i];}
  if(!L)return;var pr=levelProgress(L);
  if(!pr.done||S.levelClaims[id])return;
  S.levelClaims[id]=true;S.points+=L.pts;save();
  showInfo("领取成功",'关卡「'+L.name+'」奖励已发放，积分 +'+L.pts+'，当前 '+S.points+' 分。');
  renderAll();
}
function redeem(id){
  var r=null;for(var i=0;i<S.rewards.length;i++){if(S.rewards[i].id===id){r=S.rewards[i];break;}}
  if(!r||S.points<r.cost)return;
  S.points-=r.cost;S.redemptions.push({id:uid(),name:r.name,cost:r.cost,date:todayStr()});save();renderAll();
}
function addReward(){
  var name=prompt("奖励名称：","比如：看一场电影");if(!name)return;
  var cost=parseInt(prompt("所需积分：","60"),10);if(isNaN(cost)||cost<=0)return;
  S.rewards.push({id:uid(),name:name,cost:cost});save();renderPoints();
}

/* ============ 知识点卡片管理 ============ */
var editId=null,pendingImage=null;
function openCardMgr(){editId=null;pendingImage=null;document.getElementById("cardForm").classList.add("hidden");document.getElementById("cardListBox").classList.remove("hidden");document.getElementById("cardSheetTitle").textContent="知识点卡片库（"+S.cards.length+"）";renderCardList();showMask("maskCard");}
function renderCardList(){
  var box=document.getElementById("cardList");var html="";
  if(S.cards.length===0){html='<div class="muted">还没有卡片，点上方按钮新增。</div>';}
  S.cards.forEach(function(c){
    html+='<div class="crow"><div class="q">'+esc(c.question)+'<div class="s">'+esc(c.subject)+(c.mastered?' · 已掌握':'')+(c.image?' · 图':'')+'</div></div>'+
      '<button class="mini" onclick="editCard(\''+c.id+'\')">编辑</button>'+
      '<button class="mini del" onclick="delCard(\''+c.id+'\')">删除</button></div>';
  });
  box.innerHTML=html;
}
function editCard(id){
  editId=id;var c=null;for(var i=0;i<S.cards.length;i++){if(S.cards[i].id===id){c=S.cards[i];break;}}
  pendingImage=c.image||null;
  document.getElementById("fSubject").value=c.subject;
  document.getElementById("fQuestion").value=c.question;
  document.getElementById("fAnswer").value=c.answer;
  document.getElementById("fAnalysis").value=c.analysis||"";
  syncImgPrev();
  document.getElementById("cardListBox").classList.add("hidden");
  document.getElementById("cardForm").classList.remove("hidden");
  document.getElementById("cardSheetTitle").textContent="编辑知识点";
}
function delCard(id){if(!confirm("确定删除这张卡片？"))return;S.cards=S.cards.filter(function(c){return c.id!==id;});save();renderCardList();document.getElementById("cardSheetTitle").textContent="知识点卡片库（"+S.cards.length+"）";}
function onPickImage(input){
  if(!input.files||!input.files[0])return;
  var file=input.files[0];
  if(file.size>10*1024*1024){alert("图片不能超过 10MB");return;}
  compressImage(file,function(b64){pendingImage=b64;syncImgPrev();});
}
function compressImage(file,cb){
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height,max=800,r=Math.min(1,max/Math.max(w,h));
      var cw=Math.round(w*r),ch=Math.round(h*r);
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
      cv.getContext("2d").drawImage(img,0,0,cw,ch);
      try{cb(cv.toDataURL("image/jpeg",0.72));}catch(e){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function syncImgPrev(){
  var prev=document.getElementById("imgPrev"),rm=document.getElementById("rmImg");
  if(pendingImage){prev.src=pendingImage;prev.classList.remove("hidden");rm.classList.remove("hidden");}
  else{prev.classList.add("hidden");rm.classList.add("hidden");}
}
function removeImage(){pendingImage=null;syncImgPrev();}
function saveCard(){
  var sub=document.getElementById("fSubject").value.trim();
  var q=document.getElementById("fQuestion").value.trim();
  var a=document.getElementById("fAnswer").value.trim();
  var an=document.getElementById("fAnalysis").value.trim();
  if(!q||!a){alert("题目和答案都要填哦");return;}
  if(editId){
    for(var i=0;i<S.cards.length;i++){if(S.cards[i].id===editId){S.cards[i].subject=sub;S.cards[i].question=q;S.cards[i].answer=a;S.cards[i].analysis=an;S.cards[i].image=pendingImage;break;}}
  }else{
    S.cards.push({id:uid(),subject:sub||"未分类",question:q,answer:a,analysis:an,box:1,dueDate:todayStr(),totalPracticed:0,totalCorrect:0,wrongCount:0,mastered:false,image:pendingImage});
  }
  save();editId=null;pendingImage=null;
  document.getElementById("cardForm").classList.add("hidden");
  document.getElementById("cardListBox").classList.remove("hidden");
  document.getElementById("cardSheetTitle").textContent="知识点卡片库（"+S.cards.length+"）";
  renderCardList();
}

/* ============ 备份 / 导入 / 清空 ============ */
function exportJSON(){
  var data={type:"km-account",v:3,username:sess.user,account:curUser()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="知识记忆台_"+sess.user+"_备份_"+todayStr()+".json";a.click();
  showInfo("已导出","已导出账号「"+sess.user+"」的全部知识库备份。");
}
function importJSON(file){
  var rd=new FileReader();
  rd.onload=function(){try{
    var d=JSON.parse(rd.result);
    if(d.type!=="km-account"||!d.account||!d.account.libs)throw 0;
    if(ROOT.accounts[d.username]&&!confirm("已存在账号「"+d.username+"」，是否覆盖？"))return;
    ROOT.accounts[d.username]=d.account;
    sess={user:d.username,lib:Object.keys(d.account.libs)[0]};saveSession();S=curLib();ensureLib(S);save();
    afterLogin();
    showInfo("导入成功","已恢复账号「"+d.username+"」及其知识库。");
  }catch(e){showInfo("导入失败","请使用本工作台导出的账号备份文件。");}};
  rd.readAsText(file);
}
function clearAll(){
  if(!confirm("将清空当前知识库的全部卡片、积分、关卡与兑换记录，且无法恢复。确定？"))return;
  curUser().libs[sess.lib]=seedLib();S=curLib();save();
  showInfo("已清空","当前知识库已重置为示例状态。");renderAll();
}

/* ============ 初始化 ============ */
function bindUI(){
  document.getElementById("btnExport").onclick=exportJSON;
  document.getElementById("btnImport").onclick=function(){document.getElementById("fileInput").click();};
  document.getElementById("fileInput").onchange=function(e){if(e.target.files[0])importJSON(e.target.files[0]);};
  document.getElementById("btnAddCard").onclick=function(){editId=null;pendingImage=null;
    document.getElementById("fSubject").value="";document.getElementById("fQuestion").value="";document.getElementById("fAnswer").value="";document.getElementById("fAnalysis").value="";
    syncImgPrev();
    document.getElementById("cardListBox").classList.add("hidden");document.getElementById("cardForm").classList.remove("hidden");document.getElementById("cardSheetTitle").textContent="新增知识点";};
  document.getElementById("btnSaveCard").onclick=saveCard;
  document.getElementById("btnLib").onclick=openLibMgr;
  document.getElementById("btnTheme").onclick=openTheme;
  document.getElementById("btnApp").onclick=installApp;

  document.getElementById("btnLogout").onclick=logout;
  document.getElementById("btnDismissTip").onclick=function(){var e=document.getElementById("installTip");if(e)e.classList.add("hidden");try{localStorage.setItem("km_tip_done","1");}catch(_){}};
  document.getElementById("loginBtn").onclick=doLogin;
  document.getElementById("regBtn").onclick=doRegister;
  document.getElementById("btnCreateLib").onclick=createLib;
  document.querySelectorAll(".tab").forEach(function(el){el.onclick=function(){switchTab(el.dataset.tab);};});
  document.querySelectorAll("[data-close]").forEach(function(el){el.onclick=function(){hideMask(el.dataset.close);};});
  document.querySelectorAll(".mask").forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove("show");};});
}
function init(){
  bindUI();
  applyCurrentTheme();
  setSync("加载中");
  loadCloudThen().then(async function(){
    if(dbReady() && typeof getDB().onUpdated==="function"){getDB().onUpdated(onDbUpdate);}
    if(!ROOT)ROOT=freshRoot();
    if(SB_ENABLED()){
      // 方案B：优先用持久化的会话密钥免密自动恢复登录；无则要求输入密码
      var s0=restoreSession();
      if(s0 && ROOT.accounts[s0.user] && ROOT.accounts[s0.user].libs[s0.lib]){
        var k0=await restoreSessionKey(s0.user);
        if(k0){ SESS_KEY=k0; sess=s0; S=curLib(); ensureLib(S); afterLogin(); sbPullAcc(); return; }
      }
      showLogin();
      return;
    }
    var s=restoreSession();
    if(s && ROOT.accounts[s.user] && ROOT.accounts[s.user].libs[s.lib]){
      sess=s;S=curLib();ensureLib(S);afterLogin();
    }else if(ROOT._legacyPass && ROOT.accounts["默认账号"]){
      // 旧版本数据迁移：自动登录默认账号，并提示凭据
      var acc=ROOT.accounts["默认账号"];
      var lib=acc.activeLib&&acc.libs[acc.activeLib]?acc.activeLib:Object.keys(acc.libs)[0];
      sess={user:"默认账号",lib:lib};saveSession();S=curLib();ensureLib(S);afterLogin();
      var pass=ROOT._legacyPass; delete ROOT._legacyPass; save();
      showInfo("数据已迁移","检测到旧版本数据，已自动归入「默认账号」并为你登录。\n用户名：默认账号\n密码："+pass+"\n（可在「知识库」管理中创建独立账号，或尽快修改默认账号密码。）");
    }else if(s && ROOT.accounts[s.user]){
      s.lib=Object.keys(ROOT.accounts[s.user].libs)[0];sess=s;saveSession();S=curLib();ensureLib(S);afterLogin();
    }else{
      showLogin();
    }
  });
}

var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();deferredPrompt=e;refreshAppBtn();
});
window.addEventListener("appinstalled",function(){
  deferredPrompt=null;refreshAppBtn();

function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    var uc=deferredPrompt.userChoice;deferredPrompt=null;
    if(uc&&uc.then)uc.then(function(){});
    return;
  }
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isIOS){
    showInfo("添加到主屏幕","在 Safari 中，点击底部「分享」按钮 → 选择「添加到主屏幕」，即可生成 APP 图标。");
  }else{

  }
}
